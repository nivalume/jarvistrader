path = "src/lib.rs"

[dependencies]
kernel-core.workspace = true
model.workspace = true
data.workspace = true
strategy.workspace = true
engine.workspace = true
backtest.workspace = true
node.workspace = true
corpus.workspace = true
sys.workspace = true
pyo3 = { version = "0.29.3", features = ["abi3-py311", "extension-module"] }
