[package]
name = "py"
description = "The jarvis Python extension (jarvis._core): model types, event logs, strategies and the node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "_core"
