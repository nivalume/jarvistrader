# The Rust tree (docs/rust-migration.md, docs/rust-plan.md). It is built next to the C++ tree
# and verified against it byte for byte; nothing here is wired into the Python package yet.
[workspace]
resolver = "2"
members = [
  "crates/kernel/core",
  "crates/kernel/model",
  "crates/kernel/data",
  "crates/kernel/cost",
  "crates/kernel/portfolio",
  "crates/kernel/execution",
  "crates/kernel/risk",
  "crates/kernel/strategy",
  "crates/kernel/engine",
  "crates/kernel/backtest",
  "crates/shell/sys",
  "crates/shell/node",
  "crates/shell/network",
  "crates/shell/binance",
  "crates/shell/live",
  "crates/testkit/testkit",
  "crates/testkit/corpus",
  "crates/tools/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
kernel-core = { package = "core", path = "crates/kernel/core" }
model = { path = "crates/kernel/model" }
data = { path = "crates/kernel/data" }
cost = { path = "crates/kernel/cost" }
portfolio = { path = "crates/kernel/portfolio" }
execution = { path = "crates/kernel/execution" }
risk = { path = "crates/kernel/risk" }
strategy = { path = "crates/kernel/strategy" }
engine = { path = "crates/kernel/engine" }
backtest = { path = "crates/kernel/backtest" }
sys = { path = "crates/shell/sys" }
node = { path = "crates/shell/node" }
network = { path = "crates/shell/network" }
binance = { path = "crates/shell/binance" }
live = { path = "crates/shell/live" }
testkit = { path = "crates/testkit/testkit" }
corpus = { path = "crates/testkit/corpus" }

# Lints shared by every crate. Kernel crates add `#![no_std]`, `#![forbid(unsafe_code)]` and the
# float ban in their lib.rs; the kernel directory's clippy.toml bans HashMap and unstable sorts.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that work against the kernel's style (fixed-width integer code, explicit casts).
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
inline_always = "allow"
many_single_char_names = "allow"
# Determinism: no wall clock, no process-wide random state in any crate (the shell gets its time
# from sys, which is the one layer allowed to call the operating system).
disallowed_types = "deny"
disallowed_methods = "deny"

# Overflow is a bug everywhere (ADR 0001): checked in every profile, so Release and debug fail
# identically instead of wrapping silently in one of them. Code that wants wraparound says so
# with wrapping_*.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
debug = 1
lto = "thin"
codegen-units = 1

# The determinism gate compares the output of this profile with `release` byte for byte
# (docs/architecture.md section 17.2; `det-o0` in the C++ tree).
[profile.det-o0]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
