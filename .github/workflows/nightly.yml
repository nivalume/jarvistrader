name: Nightly

# Long-running checks (docs/architecture.md section 17.6): large forward trace validation runs,
# the chaos test with many seeds, and a one-hour soak of the live node against the test's faulty
# venue whose log is then checked against the OrderLifecycle spec (backward trace validation).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libclang-rt-18-dev libssl-dev
      - name: ThreadSanitizer build and tests
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset tsan -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build --preset tsan
          ctest --preset tsan

  chaos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build libssl-dev
      - name: The live node against a faulty venue, 20 seeds
        run: |
          cmake --preset dev -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build --preset dev --target test_chaos
          JARVIS_CHAOS_SEEDS=20 build/dev/tests/test_chaos

  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build libssl-dev
      - name: One hour of the live node against the faulty venue (ASan and UBSan)
        run: |
          cmake --preset dev -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build --preset dev --target test_chaos jarvis_cli
          mkdir -p build/soak
          JARVIS_CHAOS_SEEDS=1 JARVIS_CHAOS_SOAK_S=3600 JARVIS_CHAOS_KEEP=build/soak \
            build/dev/tests/test_chaos
      - name: Backward trace validation of the soak log
        run: |
          python3 tools/tla/check_trace.py --spec OrderLifecycle --log build/soak/seed-1 \
            --jarvis build/dev/bin/jarvis
      - name: Keep the soak run when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-run
          path: build/soak
          retention-days: 7

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libclang-rt-18-dev libssl-dev
      - name: Build fuzz targets
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz
      - name: Fuzz each target for 10 minutes
        run: |
          for exe in build/fuzz/tests/fuzz/fuzz_*; do
            target="$(basename "$exe")"
            target="${target#fuzz_}"
            mkdir -p "build/fuzz/corpus-scratch/$target"
            "$exe" -max_total_time=600 "build/fuzz/corpus-scratch/$target" "tests/fuzz/corpus/$target"
          done

  formal-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run every spec
        run: python3 tools/tla/run_tlc.py --all
      - name: Build the trace tools
        run: |
          sudo apt-get update && sudo apt-get install --yes ninja-build
          cmake -S . -B build/trace -G Ninja -DCMAKE_BUILD_TYPE=Release -DJARVIS_BUILD_PYTHON=OFF \
            -DJARVIS_BUILD_EXAMPLES=OFF
          cmake --build build/trace --target trace_driver jarvis_cli
      - name: Forward trace validation, 20000 behaviours per spec
        env:
          SEED: ${{ github.run_number }}
        run: |
          forward="$(python3 -c 'import sys; sys.path.insert(0, "tools/tla"); import mapfile; print(" ".join(s.name for s in mapfile.load().specs if s.forward))')"
          for spec in $forward; do
            echo "behaviours of $spec with seed $SEED"
            python3 tools/tla/behaviours.py --spec "$spec" --num 20000 --depth 32 --seed "$SEED"
            build/trace/bin/trace_driver "build/tla/behaviours/$spec.txt"
          done
      - name: Backward trace validation of the golden traces
        run: python3 tools/tla/check_trace.py --spec OrderLifecycle --golden
