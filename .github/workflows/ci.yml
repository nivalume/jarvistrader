name: CI

# Gate order (docs/architecture.md section 17): lint, then the functional tier; the benchmark
# and formal tiers start only after the functional tier passes. `gate` is the required check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-18 clang-format-18 clang-tidy-18
          python -m pip install "scikit-build-core==1.0.3" "pre-commit==4.6.2" "actionlint-py==1.7.12.25"
      - name: Configure for compile_commands.json
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset dev -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: pre-commit (format, tidy, layering, generated files, actionlint)
        env:
          CLANG_FORMAT: clang-format-18
          CLANG_TIDY: clang-tidy-18
        run: pre-commit run --all-files

  functional:
    needs: lint
    name: functional (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - os: macos-14
            compiler: AppleClang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux compiler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build gcc-13 g++-13 clang-18 libclang-rt-18-dev
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Python build tools
        run: python -m pip install "scikit-build-core==1.0.3" "pytest==9.1.1"
      - name: Configure sanitizer build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset dev -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build --preset dev
      - name: C++ tests (unit, property, conformance, golden, zero-alloc)
        run: ctest --preset dev
      - name: Build and install the wheel
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: python -m pip install --force-reinstall ".[parquet]"
      - name: Python and tooling tests
        run: python -m pytest

  determinism:
    needs: functional
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18
      - name: Build and test Release and O0
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          py="$(python -c 'import sys; print(sys.executable)')"
          for preset in rel det-o0; do
            cmake --preset "$preset" -DPython_EXECUTABLE="$py"
            cmake --build --preset "$preset"
            ctest --preset "$preset"
          done
      - name: Fingerprint comparison (Release vs O0 event logs must be byte-identical)
        run: tools/fingerprint_gate.sh build/rel build/det-o0 7 200000

  fuzz:
    needs: functional
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libclang-rt-18-dev
      - name: Build fuzz targets
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz
      - name: Fuzz each target for 60 seconds from its seed corpus
        run: |
          for exe in build/fuzz/tests/fuzz/fuzz_*; do
            target="$(basename "$exe")"
            target="${target#fuzz_}"
            mkdir -p "build/fuzz/corpus-scratch/$target"
            "$exe" -max_total_time=60 "build/fuzz/corpus-scratch/$target" "tests/fuzz/corpus/$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: crash-*

  bench-compare:
    needs: functional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18
      - name: A/B benchmarks against the merge-base
        env:
          CC: clang-18
          CXX: clang++-18
        run: tools/bench_ab.sh "origin/${{ github.base_ref }}" 3
      - name: Publish summary
        if: always()
        run: |
          if [[ -f build/ab/summary.md ]]; then cat build/ab/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  formal:
    needs: functional
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select affected specs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              python3 tools/tla/select_specs.py --base "origin/$BASE_REF" --github-output ;;
            push)
              base="$BEFORE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                base="HEAD~1"
              fi
              python3 tools/tla/select_specs.py --base "$base" --github-output ;;
            *)
              python3 tools/tla/select_specs.py --all --github-output ;;
          esac
      - uses: actions/setup-java@v4
        if: steps.select.outputs.specs != ''
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        if: steps.select.outputs.specs != ''
        with:
          path: build/tools
          key: tla2tools-${{ hashFiles('specs/tla/tla2tools.lock') }}
      - name: Run TLC
        if: steps.select.outputs.specs != ''
        env:
          SPECS: ${{ steps.select.outputs.specs }}
        run: |
          args=()
          for spec in $SPECS; do args+=(--spec "$spec"); done
          python3 tools/tla/run_tlc.py "${args[@]}"
      - name: Build the trace tools
        if: steps.select.outputs.forward != '' || steps.select.outputs.backward != ''
        run: |
          sudo apt-get update && sudo apt-get install --yes ninja-build
          cmake -S . -B build/trace -G Ninja -DCMAKE_BUILD_TYPE=Release -DJARVIS_BUILD_PYTHON=OFF \
            -DJARVIS_BUILD_EXAMPLES=OFF
          cmake --build build/trace --target trace_driver jarvis_cli
      - name: Forward trace validation
        if: steps.select.outputs.forward != ''
        env:
          SPECS: ${{ steps.select.outputs.forward }}
          SEED: ${{ github.run_number }}
        run: |
          for spec in $SPECS; do
            python3 tools/tla/behaviours.py --check "tests/trace/behaviours/$spec.txt"
            echo "fresh behaviours of $spec with seed $SEED"
            python3 tools/tla/behaviours.py --spec "$spec" --num 2000 --depth 24 --seed "$SEED"
            build/trace/bin/trace_driver "build/tla/behaviours/$spec.txt"
          done
      - name: Backward trace validation
        if: steps.select.outputs.backward != ''
        env:
          SPECS: ${{ steps.select.outputs.backward }}
        run: |
          for spec in $SPECS; do
            python3 tools/tla/check_trace.py --jarvis build/trace/bin/jarvis --spec "$spec" --golden
          done

  gate:
    if: always()
    needs: [lint, functional, determinism, fuzz, bench-compare, formal]
    runs-on: ubuntu-24.04
    steps:
      - name: Check tier results
        env:
          LINT: ${{ needs.lint.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
          DETERMINISM: ${{ needs.determinism.result }}
          BENCH: ${{ needs.bench-compare.result }}
          FORMAL: ${{ needs.formal.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          ok=1
          for pair in "lint:$LINT" "functional:$FUNCTIONAL" "determinism:$DETERMINISM" "fuzz:$FUZZ" "formal:$FORMAL"; do
            if [[ "${pair#*:}" != success ]]; then echo "${pair%%:*}: ${pair#*:}"; ok=0; fi
          done
          case "$BENCH" in
            success|skipped) ;;
            *) echo "bench-compare: $BENCH"; ok=0 ;;
          esac
          [[ "$ok" == 1 ]]

  bench-archive:
    needs: functional
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18
      - name: Build and run benchmarks
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset bench -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build --preset bench
          mkdir -p benchmark-results
          for exe in build/bench/benchmarks/bench_*; do
            "$exe" --benchmark_repetitions=5 --benchmark_out="benchmark-results/$(basename "$exe").json" \
              --benchmark_out_format=json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: benchmark-results/
