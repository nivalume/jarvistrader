name: CI

# Gate order (docs/architecture.md section 17): lint, then the functional tier; the benchmark
# and formal tiers start only after the functional tier passes. `gate` is the required check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-18 clang-format-18 clang-tidy-18 libssl-dev
          python -m pip install "scikit-build-core==1.0.3" "pre-commit==4.6.2" "actionlint-py==1.7.12.25"
      - name: Configure for compile_commands.json
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset dev -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: pre-commit (format, tidy, layering, generated files, actionlint)
        env:
          CLANG_FORMAT: clang-format-18
          CLANG_TIDY: clang-tidy-18
        run: pre-commit run --all-files

  functional:
    needs: lint
    name: functional (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - os: macos-14
            compiler: AppleClang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux compiler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build gcc-13 g++-13 clang-18 libclang-rt-18-dev libssl-dev
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Install Python build tools
        run: python -m pip install "scikit-build-core==1.0.3" "pytest==9.1.1"
      - name: Configure sanitizer build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset dev -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build --preset dev
      - name: C++ tests (unit, property, conformance, golden, zero-alloc)
        run: ctest --preset dev
      - name: Build and install the wheel
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: python -m pip install --force-reinstall ".[parquet]"
      - name: Python and tooling tests
        run: python -m pytest

  # Windows with clang-cl (the MSVC ABI; python.org CPython loads the extension). The VS developer
  # shell supplies the MSVC library and the Windows SDK; clang-cl comes with the VS image's LLVM.
  windows:
    needs: lint
    name: functional (clang-cl, Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ninja, Python build tools and OpenSSL
        shell: pwsh
        run: |
          python -m pip install "scikit-build-core==1.0.3" "pytest==9.1.1" "ninja==1.13.2"
          $candidates = "C:\Program Files\OpenSSL", "C:\Program Files\OpenSSL-Win64"
          $ssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $ssl) {
            choco install openssl --no-progress --yes
            $ssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          }
          if (-not $ssl) { throw "OpenSSL 3 with headers not found" }
          "OPENSSL_ROOT_DIR=$ssl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ssl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build, C++ tests, wheel and Python tests (VS developer shell)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          clang-cl --version
          $py = (Get-Command python).Source
          cmake --preset win-dev "-DPython_EXECUTABLE=$py"
          cmake --build --preset win-dev
          ctest --preset win-dev
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          python -m pip install --force-reinstall ".[parquet]"
          python -m pytest

  # The MinGW-w64 build, cross-compiled from Linux, its tests run under Wine (the mingw-cross preset).
  mingw-cross:
    needs: lint
    name: functional (MinGW-w64 cross, Wine)
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      JARVIS_MINGW_PREFIX: ${{ github.workspace }}/build/mingw-prefix/mingw64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the cross compiler and Wine
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-mingw-w64-x86-64-posix wine64 zstd
      - name: OpenSSL for MinGW (the MSYS2 mingw64 package)
        run: |
          pkg=mingw-w64-x86_64-openssl-3.6.5-1-any.pkg.tar.zst
          mkdir -p build/mingw-prefix
          curl -fsSL -o "build/mingw-prefix/$pkg" "https://repo.msys2.org/mingw/mingw64/$pkg"
          echo "389d1af21e99223d9e2cd32d4c073131b276da85be7636bd8d23571f6938864f  build/mingw-prefix/$pkg" |
            sha256sum --check
          tar --zstd -xf "build/mingw-prefix/$pkg" -C build/mingw-prefix
      - name: Configure and build
        run: |
          cmake --preset mingw-cross
          cmake --build --preset mingw-cross
      - name: Tests under Wine
        run: |
          /usr/lib/wine/wine64 wineboot --init # create the prefix once, before tests run
          ctest --preset mingw-cross

  determinism:
    needs: functional
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libssl-dev
      - name: Build and test Release and O0
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          py="$(python -c 'import sys; print(sys.executable)')"
          for preset in rel det-o0; do
            cmake --preset "$preset" -DPython_EXECUTABLE="$py"
            cmake --build --preset "$preset"
            ctest --preset "$preset"
          done
      - name: Fingerprint comparison (Release vs O0 event logs must be byte-identical)
        run: tools/fingerprint_gate.sh build/rel build/det-o0 7 200000

  fuzz:
    needs: functional
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libclang-rt-18-dev libssl-dev
      - name: Build fuzz targets
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz
      - name: Fuzz each target for 60 seconds from its seed corpus
        run: |
          for exe in build/fuzz/tests/fuzz/fuzz_*; do
            target="$(basename "$exe")"
            target="${target#fuzz_}"
            mkdir -p "build/fuzz/corpus-scratch/$target"
            "$exe" -max_total_time=60 "build/fuzz/corpus-scratch/$target" "tests/fuzz/corpus/$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: crash-*

  bench-compare:
    needs: functional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libssl-dev
      - name: A/B benchmarks against the merge-base
        env:
          CC: clang-18
          CXX: clang++-18
        run: tools/bench_ab.sh "origin/${{ github.base_ref }}" 3
      - name: Publish summary
        if: always()
        run: |
          if [[ -f build/ab/summary.md ]]; then cat build/ab/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  formal:
    needs: functional
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select affected specs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              python3 tools/tla/select_specs.py --base "origin/$BASE_REF" --github-output ;;
            push)
              base="$BEFORE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                base="HEAD~1"
              fi
              python3 tools/tla/select_specs.py --base "$base" --github-output ;;
            *)
              python3 tools/tla/select_specs.py --all --github-output ;;
          esac
      - uses: actions/setup-java@v4
        if: steps.select.outputs.specs != ''
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        if: steps.select.outputs.specs != ''
        with:
          path: build/tools
          key: tla2tools-${{ hashFiles('specs/tla/tla2tools.lock') }}
      - name: Run TLC
        if: steps.select.outputs.specs != ''
        env:
          SPECS: ${{ steps.select.outputs.specs }}
        run: |
          args=()
          for spec in $SPECS; do args+=(--spec "$spec"); done
          python3 tools/tla/run_tlc.py "${args[@]}"
      - name: Build the trace tools
        if: steps.select.outputs.forward != '' || steps.select.outputs.backward != ''
        run: |
          sudo apt-get update && sudo apt-get install --yes ninja-build
          cmake -S . -B build/trace -G Ninja -DCMAKE_BUILD_TYPE=Release -DJARVIS_BUILD_PYTHON=OFF \
            -DJARVIS_BUILD_EXAMPLES=OFF
          cmake --build build/trace --target trace_driver jarvis_cli
      - name: Forward trace validation
        if: steps.select.outputs.forward != ''
        env:
          SPECS: ${{ steps.select.outputs.forward }}
          SEED: ${{ github.run_number }}
        run: |
          for spec in $SPECS; do
            python3 tools/tla/behaviours.py --check "tests/trace/behaviours/$spec.txt"
            echo "fresh behaviours of $spec with seed $SEED"
            python3 tools/tla/behaviours.py --spec "$spec" --num 2000 --depth 24 --seed "$SEED"
            build/trace/bin/trace_driver "build/tla/behaviours/$spec.txt"
          done
      - name: Backward trace validation
        if: steps.select.outputs.backward != ''
        env:
          SPECS: ${{ steps.select.outputs.backward }}
        run: |
          for spec in $SPECS; do
            python3 tools/tla/check_trace.py --jarvis build/trace/bin/jarvis --spec "$spec" --golden
          done

  # The Rust tree (docs/rust-plan.md): format, clippy as errors, tests in the dev, release and
  # det-o0 profiles, and the kernel crates checked on a target without std.
  rust:
    needs: lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --profile det-o0
      - name: Kernel crates build without std
        run: |
          kernel=$(ls crates/kernel | grep '^jarvis-' | sed 's/^/-p /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          cargo check $kernel --target x86_64-unknown-none
      - name: Determinism gate (release vs det-o0 corpus, golden fingerprint)
        run: |
          cargo build --release -p jarvis-cli
          cargo build --profile det-o0 -p jarvis-cli
          ./target/release/jarvis-rs corpus --seed 7 --events 200000 --out target/fp-release.jlog
          ./target/det-o0/jarvis-rs corpus --seed 7 --events 200000 --out target/fp-det-o0.jlog
          cmp target/fp-release.jlog target/fp-det-o0.jlog
          ./target/release/jarvis-rs fingerprint target/fp-release.jlog | diff - tests/golden/corpus_seed7_200000.fingerprint
      - name: Conformance vectors are up to date
        run: python3 tools/gen_conformance.py && git diff --exit-code -- crates/kernel/model

  gate:
    if: always()
    needs: [lint, functional, windows, mingw-cross, determinism, fuzz, bench-compare, formal, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Check tier results
        env:
          LINT: ${{ needs.lint.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
          WINDOWS: ${{ needs.windows.result }}
          MINGW: ${{ needs.mingw-cross.result }}
          DETERMINISM: ${{ needs.determinism.result }}
          BENCH: ${{ needs.bench-compare.result }}
          FORMAL: ${{ needs.formal.result }}
          FUZZ: ${{ needs.fuzz.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          ok=1
          for pair in "lint:$LINT" "functional:$FUNCTIONAL" "windows:$WINDOWS" "mingw-cross:$MINGW" \
                      "determinism:$DETERMINISM" "fuzz:$FUZZ" "formal:$FORMAL" "rust:$RUST"; do
            if [[ "${pair#*:}" != success ]]; then echo "${pair%%:*}: ${pair#*:}"; ok=0; fi
          done
          case "$BENCH" in
            success|skipped) ;;
            *) echo "bench-compare: $BENCH"; ok=0 ;;
          esac
          [[ "$ok" == 1 ]]

  bench-archive:
    needs: functional
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libssl-dev
      - name: Build and run benchmarks
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset bench -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build --preset bench
          mkdir -p benchmark-results
          for exe in build/bench/benchmarks/bench_*; do
            "$exe" --benchmark_repetitions=5 --benchmark_out="benchmark-results/$(basename "$exe").json" \
              --benchmark_out_format=json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: benchmark-results/
