# Spec-to-source map (docs/architecture.md sections 17.4 and 17.5).
#
# tools/tla/select_specs.py reads this file to decide which specs a change affects, and generates
# tools/core-paths.txt and .github/labeler.yml from it. Run `python3 tools/tla/select_specs.py --emit`
# after editing; the lint job fails when the generated files are stale.
#
# [specs.<Name>] keys:
#   paths       globs of the source files the spec models (** matches any depth)
#   forward     TLC behaviours (specs/tla/<Name>Behaviours.tla) are replayed through the
#               implementation by tests/trace/trace_driver; tests/trace/behaviours/<Name>.txt
#               is the committed set ctest replays
#   backward    event logs are projected on the spec (`jarvis trace-export`) and checked by TLC
#   budget_min  wall-clock budget for one TLC run
#   tlc_args    extra TLC command-line arguments
#   trace_vars  the variables behaviour files keep (all when absent): the ones the trace driver
#               compares, so a spec with a large environment writes small files

[specs.SeqOrder]
paths = ["jarvis/core/event_key.hpp", "jarvis/core/priority_queue.hpp"]
forward = false
backward = false
budget_min = 2
tlc_args = ["-deadlock"]

[specs.OrderLifecycle]
paths = ["jarvis/execution/order_fsm.hpp", "jarvis/execution/order.hpp",
         "jarvis/execution/oms.hpp", "jarvis/execution/execution_engine.hpp",
         "specs/map/order_lifecycle_actions.hpp"]
forward = true
backward = true
budget_min = 5
tlc_args = []

[specs.TradingState]
paths = ["jarvis/risk/trading_state.hpp", "jarvis/risk/rate_limit.hpp",
         "jarvis/risk/gates.hpp", "specs/map/trading_state_actions.hpp"]
forward = true
backward = false
budget_min = 5
tlc_args = []

[specs.Matching]
paths = ["jarvis/backtest/matching/sim_exchange.hpp", "specs/map/matching_actions.hpp"]
forward = true
backward = false
budget_min = 5
tlc_args = []

[specs.Reconciliation]
# The session state machine lands in jarvis/execution/reconciliation.hpp (M5); forward trace
# validation follows it.
paths = ["jarvis/execution/reconciliation.hpp", "specs/map/reconciliation_actions.hpp"]
forward = false
backward = false
budget_min = 5
tlc_args = []

[specs.DepthSync]
paths = ["jarvis/adapter/binance/depth_sync.hpp", "specs/map/depth_sync_actions.hpp"]
forward = true
backward = false
budget_min = 5
tlc_args = []
trace_vars = ["phase", "local", "lastU", "visible", "out"]

[global]
# Touching any of these runs every spec.
always = ["jarvis/core/**", "jarvis/engine/**", "specs/tla/**", "specs/map/**"]

[core]
# Core paths are the union of all spec paths and these globs.
extra = [
  "jarvis/core/**",
  "jarvis/engine/**",
  "jarvis/execution/**",
  "jarvis/risk/**",
  "jarvis/backtest/matching/**",
  "jarvis/data/book/**",
  "specs/**",
]
