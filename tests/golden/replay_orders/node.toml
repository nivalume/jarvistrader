# Golden replay case "orders": both sides quoted at the touch against the simulated venue
# (queue-position fills, latency with jitter), with cancels, rejections, taker fills, expiries,
# denials and modifies racing fills. See the orders plan in tests/cpp/golden_node.cpp.
[node]
id = "golden"
seed = 3

[data]
catalog = "catalog"  # replaced with --set by case.toml
range = { start = "2026-09-01T00:00:00Z", end = "2026-09-01T00:03:00Z" }

[[data.streams]]
venue = "BINANCE_USDM"
instruments = ["BTCUSDT-PERP.BINANCE"]
streams = ["aggTrade", "bookTicker"]

[[venues]]
id = "BINANCE_USDM"
kind = "binance_usdm"

[venues.sim]
fill_model = "queue_position"
latency = { feed_ns = 1000000, out_ns = 20000000, in_ns = 5000000, jitter_ns = 2000000 }
fee = { schedule = "binance_usdm_vip0" }
balances = ["10000 USDT"]

[[strategies]]
id = "golden-001"
impl = "cpp:GoldenStrategy"
params = { plan = "orders" }
