<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="订单状态机：nautilus 兼容的状态与事件，每条边标注内部事件与 Binance 来源；蓝色虚线是回执与用户流走两条独立连接时的常态捷径" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="f4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="f4-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#f8f9fb" stroke="#d0d7de"/>

  <!-- legend -->
  <line x1="20" y1="620" x2="56" y2="620" stroke="#0969da" stroke-dasharray="5 4" marker-end="url(#f4-arrow-accent)"/>
  <text x="62" y="624" font-size="11">慢回执捷径：WS API 回执与用户数据流是两条独立连接，终态事件可能先到</text>
  <rect x="560" y="612" width="14" height="14" rx="3" fill="#e6eaef" stroke="#57606a"/>
  <text x="580" y="624" font-size="11">终态</text>
  <text x="630" y="624" font-size="11" fill="#57606a">边标签：内部事件 / Binance 来源</text>

  <!-- states -->
  <rect x="30" y="278" width="120" height="44" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="90" y="305" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Initialized</text>
  <rect x="30" y="468" width="120" height="44" rx="8" fill="#e6eaef" stroke="#57606a"/>
  <text x="90" y="495" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Denied</text>

  <rect x="240" y="278" width="120" height="44" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="300" y="305" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Submitted</text>
  <rect x="240" y="468" width="120" height="44" rx="8" fill="#e6eaef" stroke="#57606a"/>
  <text x="300" y="495" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Rejected</text>

  <!-- working cluster -->
  <rect x="450" y="226" width="270" height="148" rx="10" fill="#ffffff" stroke="#57606a" stroke-dasharray="3 3"/>
  <text x="462" y="244" font-size="11" fill="#57606a">工作中（在交易所簿上）</text>
  <rect x="466" y="282" width="104" height="44" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="518" y="309" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Accepted</text>
  <rect x="598" y="282" width="110" height="44" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="653" y="303" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Partially</text>
  <text x="653" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Filled</text>
  <line x1="570" y1="304" x2="596" y2="304" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="583" y="346" text-anchor="middle" font-size="10" fill="#57606a">OrderFilled / X=PARTIALLY_FILLED</text>
  <path d="M636,282 C636,258 670,258 670,280" fill="none" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="630" y="264" text-anchor="end" font-size="10" fill="#57606a">再次部分成交</text>

  <rect x="500" y="80" width="170" height="44" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="585" y="107" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PendingUpdate</text>
  <rect x="500" y="476" width="170" height="44" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="585" y="503" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PendingCancel</text>

  <rect x="860" y="150" width="120" height="44" rx="8" fill="#e6eaef" stroke="#57606a"/>
  <text x="920" y="177" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Filled</text>
  <rect x="860" y="300" width="120" height="44" rx="8" fill="#e6eaef" stroke="#57606a"/>
  <text x="920" y="327" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Expired</text>
  <rect x="860" y="476" width="120" height="44" rx="8" fill="#e6eaef" stroke="#57606a"/>
  <text x="920" y="503" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Canceled</text>

  <!-- Initialized -> Submitted / Denied -->
  <line x1="150" y1="300" x2="238" y2="300" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="194" y="292" text-anchor="middle" font-size="10">OrderSubmitted</text>
  <text x="194" y="316" text-anchor="middle" font-size="10" fill="#57606a">先写 WAL 再发</text>
  <line x1="90" y1="322" x2="90" y2="466" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="98" y="390" font-size="10">OrderDenied</text>
  <text x="98" y="404" font-size="10" fill="#57606a">本地 Gate A / B</text>

  <!-- Submitted -> Rejected / Accepted -->
  <line x1="300" y1="322" x2="300" y2="466" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="308" y="382" font-size="10">OrderRejected</text>
  <text x="308" y="396" font-size="10" fill="#57606a">WS API 错误码</text>
  <text x="308" y="410" font-size="10" fill="#57606a">-5022 → due_post_only</text>
  <text x="308" y="424" font-size="10" fill="#57606a">-5021 → FOK 未成</text>
  <line x1="360" y1="300" x2="464" y2="300" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="408" y="292" text-anchor="middle" font-size="10">OrderAccepted</text>
  <text x="408" y="316" text-anchor="middle" font-size="10" fill="#57606a">X=NEW 或回执</text>

  <!-- accent shortcuts from Submitted -->
  <path d="M300,278 L300,40 L890,40 L890,148" fill="none" stroke="#0969da" stroke-dasharray="5 4" marker-end="url(#f4-arrow-accent)"/>
  <text x="596" y="32" text-anchor="middle" font-size="10" fill="#0969da">OrderFilled / 成交先于回执到达（nautilus 已有此边）</text>
  <path d="M330,278 L330,66 L820,66 L820,312 L858,312" fill="none" stroke="#0969da" stroke-dasharray="5 4" marker-end="url(#f4-arrow-accent)"/>
  <text x="575" y="59" text-anchor="middle" font-size="10" fill="#0969da">OrderExpired / X=EXPIRED 先于回执：IOC 余量、STP（jarvis 新增边）</text>

  <!-- cluster <-> PendingUpdate -->
  <line x1="540" y1="226" x2="540" y2="126" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="532" y="170" text-anchor="end" font-size="10">OrderPendingUpdate</text>
  <text x="532" y="184" text-anchor="end" font-size="10" fill="#57606a">发出 order.modify</text>
  <line x1="630" y1="124" x2="630" y2="224" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="638" y="150" font-size="10">OrderUpdated / x=AMENDMENT</text>
  <text x="638" y="164" font-size="10">或 OrderModifyRejected</text>
  <text x="638" y="178" font-size="10" fill="#57606a">恢复 previous_status</text>

  <!-- cluster <-> PendingCancel -->
  <line x1="540" y1="374" x2="540" y2="474" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="532" y="420" text-anchor="end" font-size="10">OrderPendingCancel</text>
  <text x="532" y="434" text-anchor="end" font-size="10" fill="#57606a">发出 order.cancel</text>
  <line x1="630" y1="476" x2="630" y2="376" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="638" y="410" font-size="10">OrderCancelRejected</text>
  <text x="638" y="424" font-size="10" fill="#57606a">-2011：已终态，等待其事件</text>
  <text x="638" y="438" font-size="10" fill="#57606a">恢复 previous_status</text>

  <!-- cluster -> terminals -->
  <line x1="720" y1="250" x2="858" y2="180" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="800" y="238" text-anchor="end" font-size="10">OrderFilled</text>
  <text x="800" y="252" text-anchor="end" font-size="10" fill="#57606a">X=FILLED</text>
  <line x1="720" y1="340" x2="858" y2="336" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="820" y="358" text-anchor="middle" font-size="10">OrderExpired</text>
  <text x="820" y="372" text-anchor="middle" font-size="10" fill="#57606a">EXPIRED_IN_MATCH · GTD</text>
  <line x1="720" y1="366" x2="858" y2="484" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="818" y="420" font-size="10">OrderCanceled</text>
  <text x="818" y="434" font-size="10" fill="#57606a">venue 侧撤单</text>
  <text x="818" y="448" font-size="10" fill="#57606a">countdownCancelAll</text>

  <!-- PendingCancel -> Canceled, and accent shortcut to Filled -->
  <line x1="670" y1="498" x2="858" y2="498" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="764" y="514" text-anchor="middle" font-size="10">OrderCanceled / x=CANCELED</text>
  <path d="M585,520 L585,560 L1040,560 L1040,172 L982,172" fill="none" stroke="#0969da" stroke-dasharray="5 4" marker-end="url(#f4-arrow-accent)"/>
  <text x="812" y="576" text-anchor="middle" font-size="10" fill="#0969da">OrderFilled / 撤单途中成交（nautilus 已有此边）</text>

  <!-- duplicate trade id self-loop on Filled -->
  <path d="M940,150 C940,120 975,120 975,148" fill="none" stroke="#57606a" marker-end="url(#f4-arrow)"/>
  <text x="984" y="118" font-size="10">同 tradeId 第二条回报</text>
  <text x="984" y="132" font-size="10" fill="#57606a">只补费用，不重复记成交</text>
</svg>
