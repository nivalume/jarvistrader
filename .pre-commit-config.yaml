repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: bash tools/run-clang-format.sh --dry-run --Werror
        language: system
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
      - id: clang-tidy
        name: clang-tidy
        entry: bash tools/run-clang-tidy.sh
        language: system
        files: '\.(cc|cpp|cxx)$'
        pass_filenames: true
      - id: cmake-format-check
        name: cmake parse check
        entry: cmake -S . -B build/pre-commit -G Ninja -DJARVIS_BUILD_PYTHON=OFF -DJARVIS_BUILD_TESTS=OFF
        language: system
        files: '(^|/)CMakeLists\.txt$|\.cmake$'
        pass_filenames: false
      - id: check-layering
        name: kernel and shell layering
        entry: python3 tools/check-layering.py
        language: system
        files: '^(jarvis|examples|python/src)/'
        pass_filenames: false
      - id: generated-files
        name: files generated from specs/tla/MAP.toml are current
        entry: python3 tools/tla/select_specs.py --check
        language: system
        files: '^(specs/tla/MAP\.toml|tools/core-paths\.txt|\.github/labeler\.yml|tools/tla/.*\.py)$'
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
